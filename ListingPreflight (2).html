}

 $('chk').onclick=runCheck;$('hcta').onclick=()=>$('fi').click();
 $('clr').onclick=()=>{ if(busy||fixing||reviewing)return;items.forEach(freeItem);staged.forEach(i=>URL.revokeObjectURL(i.url));items=[];staged=[];stat('');showErr('');renderStaged();renderRes()};
 $('fixAll').onclick=async()=>{if(busy||fixing||reviewing||!skuOk())return;const b=$('fixAll'),total=items.filter(it=>!it.fixed).length;if(!total){stat('All images are already fixed.');return}fixing=true;b.disabled=true;b.innerHTML='<span class="sp" aria-hidden="true"></span>Fixing images';showErr('');let done=0;
  try{for(let i=0;i<items.length;i++){const old=items[i];if(old.fixed)continue;const fixed=await fixedAndChecked(old,i,(message,pct)=>stat(`Image ${i+1} of ${items.length}: ${message}`,Math.round((done+pct/100)/total*100)));items[i]=fixed;done++;stat(`Fixed ${done} of ${total} images. Review the results before downloading.`)}renderRes();const left=items.filter(it=>check(it).some(x=>x.s==='bad'||x.s==='warn')).length;stat(left?`All images fixed and rechecked. ${left} still need attention; review before downloading.`:'All images fixed and rechecked. Review the results before downloading; all measurable checks pass.')}
  catch(e){renderRes();showErr(e instanceof Error?e.message:'Could not fix every image. Review the results and retry or use an individual Fix button.')}
  finally{fixing=false;if(b.isConnected){b.disabled=items.length>0&&items.every(it=>it.fixed);b.textContent=b.disabled?'All images fixed':'Fix all images'}}
 };
 $('zip').onclick=async()=>{if(busy||fixing||reviewing||!skuOk())return;if(typeof JSZip==='undefined'){showErr('The ZIP tool did not load. Check your connection and reload, or use Fix and download on each image.');return}fixing=true;const b=$('zip'),total=items.length;b.disabled=true;b.innerHTML='<span class="sp" aria-hidden="true"></span>Fixing images';showErr('');try{const z=new JSZip(),fixed=[];stat('Starting image fixes',0);await nap(30);for(let i=0;i<total;i++){const old=items[i],result=old.fixed?old:await fixedAndChecked(old,i,(message,pct)=>stat(`Image ${i+1} of ${total}: ${message}`,Math.round((i+pct/100)/total*100)));fixed.push(result);z.file(result.f.name,result.f)}stat('Building ZIP archive',98);const archive=await z.generateAsync({type:'blob'},progress=>stat(`Building ZIP archive: ${Math.round(progress.percent)}%`,98+Math.round(progress.percent*0.02)));dl(archive,`${mkv}-ready.zip`);items=fixed;renderRes();const left=items.filter(it=>check(it).some(x=>x.s==='bad'||x.s==='warn')).length;stat(left?`ZIP downloaded and checked. ${left} image${left===1?'':'s'} still need attention.`:'ZIP downloaded. All measurable checks pass; review manual notes.')}catch(e){stat('');showErr(e instanceof Error?e.message:'Could not fix and verify the images. Try downloading them one at a time.')}finally{fixing=false;if(b.isConnected){b.disabled=false;b.textContent='Fix all and download ZIP'}}};
 $('csv').onclick=()=>{if(!isPro()){go('#/pricing');return}const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[['file','marketplace','width','height','status','notes'],...items.map(it=>{const c=check(it);return[it.f.name,mkv,it.W,it.H,worst(c),c.map(x=>x.t).join(' | ')]})];dl(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}),'preflight-report.csv')};
 renderStaged();renderRes();
}
function bindContact(){
 $('cf').onsubmit=e=>{e.preventDefault();const n=$('cn2'),m=$('ce'),g=$('cm'),set=(i,el,msg)=>{$(i).textContent=msg;el.setAttribute('aria-invalid',msg?'true':'false');return!msg};
  const a=set('e1',n,n.value.trim()?'':'Enter your name.'),b=set('e2',m,/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.value.trim())?'':'Enter a valid email address.'),c=set('e3',g,g.value.trim().length>=10?'':'Write at least 10 characters.');
  if(!(a&&b&&c)){(!a?n:!b?m:g).focus();return}
  if(!CONFIG.email){$('cr').innerHTML='<div class="al" role="alert">Sending is not available because no contact email is configured.</div>';return}
  location.href=`mailto:${CONFIG.email}?subject=${encodeURIComponent('ListingPreflight message from '+n.value.trim())}&body=${encodeURIComponent(g.value.trim()+'\n\nReply to: '+m.value.trim())}`;$('cr').textContent='Your email app should open with the message ready to send.'};
}
function bindCheckout(){
 $('pf').onsubmit=e=>{e.preventDefault();const m=$('pe'),t=$('pt'),set=(i,el,msg)=>{$(i).textContent=msg;el.setAttribute('aria-invalid',msg?'true':'false');return!msg};
  const a=set('pe-e',m,/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.value.trim())?'':'Enter a valid email address.'),b=set('pt-e',t,t.checked?'':'You need to agree to continue.');
  if(!(a&&b)){(!a?m:t).focus();return}
  const link=CONFIG.checkout[qs().get('cycle')==='year'?'year':'month'],btn=$('pb');
  if(!link){$('pr').innerHTML='<div class="al" role="alert">Payments are not connected yet. Please contact us to buy Pro.</div>';return}
  trk('CheckoutStart');btn.disabled=true;btn.innerHTML='<span class="sp" aria-hidden="true"></span>Redirecting to secure payment';$('pr').textContent='Opening the payment page.';
  setTimeout(()=>{location.href=link},400);
 };
}

/* analytics and consent */
const anDomain=()=>CONFIG.analytics.domain||(/[a-z]\.[a-z]/i.test(location.hostname)?location.hostname:'');
function loadAn(){const a=CONFIG.analytics,d=anDomain();if(!a.enabled||!d||document.getElementById('an'))return;window.plausible=window.plausible||function(){(window.plausible.q=window.plausible.q||[]).push(arguments)};const s=document.createElement('script');s.id='an';s.defer=true;s.src=a.src;s.dataset.domain=d;document.head.appendChild(s)}
function needConsent(){if(CONFIG.analytics.cookieless)return false;const z=(Intl.DateTimeFormat().resolvedOptions().timeZone||'');return/^(Europe|Atlantic\/(Azores|Canary|Madeira|Reykjavik))/.test(z)}
function initAn(){const a=CONFIG.analytics;if(!a.enabled||!anDomain())return;let c=ls.get('pf-consent');
 const set=v=>{ls.set('pf-consent',v);$('ck').hidden=true;if(v==='yes')loadAn()};$('cy').onclick=()=>set('yes');$('cn').onclick=()=>set('no');
 if(!needConsent()){loadAn();return}
 $('cs').hidden=false;$('cs').onclick=()=>{$('ck').hidden=false;$('cy').focus()};
 if(c==='yes')loadAn();else if(c!=='no')$('ck').hidden=false}

window.addEventListener('error',()=>{showErr('Something went wrong. Reload the page and try again.')});
window.addEventListener('unhandledrejection',()=>{busy=false;stat('');showErr('Something went wrong. Reload the page and try again.')});
window.addEventListener('hashchange',()=>{if(location.hash!==H){H=location.hash;route()}});window.addEventListener('popstate',()=>{H=location.hash;route()});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#/"]');if(a&&e.button===0&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){e.preventDefault();go(a.getAttribute('href'))}});
$('fo').textContent=`${new Date().getFullYear()} ${CONFIG.operator||CONFIG.name}`+(CONFIG.email?`, ${CONFIG.email}`:'');
initAn();
if(CONFIG.auth.endpoint){api('/me',undefined,'GET').then(j=>U.set(j.user||null)).catch(()=>U.set(null)).finally(()=>{renderAu();route()})}
else{renderAu();route()}
